<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e9">
  <meta name="robots" content="noindex,nofollow">
  <title>SNS Audit｜Kibun Trip</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="audit.css?v=2091">
</head>
<body>
<header class="top">
  <a href="../" class="brand">Kibun Trip</a>
  <nav class="audit-nav" aria-label="管理ツール">
    <a href="../?heroAudit=1">Hero Audit</a>
    <a href="../affiliate-audit/">Affiliate Audit</a>
    <strong>SNS Audit</strong>
  </nav>
  <span class="private">PRIVATE TOOL</span>
</header>
<main class="shell">
  <section class="hero">
    <p class="eyebrow">SNS AUDIT</p>
    <h1>投稿前も、<br>投稿後もひとつに。</h1>
    <p>記事・プラン・スポットの遷移先、使用Hero、Instagram導線、Affiliate準備状況、投稿実績を投稿単位で管理します。編集内容はこの端末に自動保存され、JSONで書き出せます。</p>
  </section>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section class="actions">
    <button id="addPost" type="button">投稿を追加</button>
    <button id="copyJson" type="button" class="secondary">設定JSONをコピー</button>
    <button id="downloadJson" type="button" class="secondary">JSONを保存</button>
    <label class="import-button">JSONを読み込む<input id="importJson" type="file" accept="application/json,.json"></label>
    <button id="resetLocal" type="button" class="danger">端末保存をリセット</button>
  </section>
  <p id="flash" class="flash" role="status" aria-live="polite"></p>

  <section class="toolbar" aria-label="絞り込み">
    <label>検索<input id="textFilter" type="search" placeholder="投稿名・spot ID・URL"></label>
    <label>状態<select id="statusFilter"><option value="all">すべて</option><option value="planned" selected>予定</option><option value="draft">下書き</option><option value="scheduled">予約済み</option><option value="published">投稿済み</option></select></label>
  </section>

  <section id="auditList" class="audit-list"></section>
</main>
<footer><a href="../">Kibun Tripへ戻る</a><span>このページは検索エンジン非公開です。</span></footer>
<script src="../data.js?v=20110"></script>
<script src="../affiliate-config.js?v=20110"></script>
<script src="../affiliate-audit-status.js?v=20110"></script>
<script src="../sns-audit-data.js?v=20110"></script>
<script src="audit.js?v=20110"></script>
</body>
</html>
