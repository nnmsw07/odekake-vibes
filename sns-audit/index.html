<main class="shell"><section class="hero"><p class="eyebrow">SNS AUDIT · SEPTEMBER 2026</p><h1>投稿と、その先を<br>ひとつにつなぐ。</h1><p>9月の30投稿を、記事・プラン・スポットの遷移先、使用Hero、Instagram導線、Affiliate準備状況、投稿後の実績まで一つの画面で管理します。入力内容はこの端末に保存され、JSONで書き出せます。</p></section>
<section class="month-summary" id="monthSummary"></section>

<section class="actions"><button id="copyCalendar" type="button">表示中をTSVコピー</button><button id="copyJson" type="button" class="secondary">JSONをコピー</button><button id="downloadJson" type="button" class="secondary">JSONを保存</button><label class="import-button">JSONを読み込む<input id="importJson" type="file" accept="application/json,.json"></label><button id="resetAudit" type="button" class="secondary danger">端末保存をリセット</button></section><p id="flash" class="flash" role="status" aria-live="polite"></p>
