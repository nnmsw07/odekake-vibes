name: Apply daily content shuffle

on:
  push:
    branches:
      - feature/daily-content-shuffle

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[shuffle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply shuffle injection
        run: node scripts/apply_daily_content_shuffle.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magazine/index.html plans/index.html
          git commit -m "feat: daily-shuffle article and plan cards [shuffle-applied]"
          git push
