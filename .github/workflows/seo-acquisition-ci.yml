name: SEO acquisition CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: node --check app.js
      - name: UI regression guard
        run: node scripts/ui_regression_guard.mjs
      - name: Acquisition regression guard
        run: node scripts/acquisition_regression_guard.mjs
      - name: Recommendation tests
        run: |
          node test_recommender.js
          node test_v12.js
          node test_v17.js
          node test_v17_1.js
          node test_v18.js
          node test_v19.js
          node test_v19_places.js
          node test_v19_4.js
